name: quarterly-docs-audit

# P4 deliverable 3: NON-AGENT scheduled job that re-runs every docs validator
# and publishes the results as a docs-audit.md artifact. This is the audit's
# deterministic re-verification loop (runs independent of any agent/human).
#
# Trigger:
#   - schedule: quarterly cron (1st day of Jan/Apr/Jul/Oct at 03:17 UTC)
#   - workflow_dispatch: manual trigger for on-demand audits
#
# Output: docs-audit.md (uploaded via actions/upload-artifact). This file is
# the quarterly audit artifact; it does NOT gate releases (release gating is
# root-side), it surfaces validator drift.

on:
  schedule:
    # Jan 1, Apr 1, Jul 1, Oct 1 — 03:17 UTC
    - cron: '17 3 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Quarterly docs audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Production build (for route-reachability)
        id: build
        run: |
          # Report-only job: never stop on a failed build, but record its
          # status in docs-audit.md so a broken build can't silently produce
          # a misleading audit.
          if bun run build; then
            echo "build_status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "build_status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Run all validators
        id: audit
        env:
          BUILD_STATUS: ${{ steps.build.outputs.build_status }}
        run: |
          set +e
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "# LanOnasis Docs — Quarterly Audit (${ts})"
            echo
            echo "_Automated run: .github/workflows/quarterly-docs-audit.yml. NOT agent-generated._"
            echo
            echo "## Production build"
            echo
            if [ "$BUILD_STATUS" = "pass" ]; then
              echo "**Result: PASS**"
            else
              echo "**Result: FAIL** — artifacts may be stale; route-reachability results below may be misleading."
            fi
            echo
            echo "## Validator results"
            echo
            run() {
              local name="$1"; shift
              echo "### $name"
              echo '```'
              "$@" 2>&1
              local code=$?
              echo '```'
              if [ $code -eq 0 ]; then echo "**Result: PASS**"; else echo "**Result: FAIL ($code)**"; fi
              echo
              return $code
            }
            pass=0; fail=0; failed=""
            for v in validate:cli-docs validate:mcp-tools validate:mcp-reference validate:sdk-packages validate:claims validate:external-urls validate:route-reachability; do
              if run "$v" bun run "$v"; then pass=$((pass+1)); else fail=$((fail+1)); failed="$failed $v"; fi
            done
            echo "## Summary"
            echo
            echo "- **Passed:** $pass"
            echo "- **Failed:** $fail"
            if [ -n "$failed" ]; then echo "- **Failing:**$failed"; fi
            echo
            echo "_Generated by schedule/manual dispatch; see the run log for full validator output._"
          } > docs-audit.md
          set -e
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-audit-${{ github.run_id }}
          path: docs-audit.md

      - name: Report validator regressions
        if: steps.audit.outputs.fail != '0'
        env:
          AUDIT_FAIL: ${{ steps.audit.outputs.fail }}
          AUDIT_FAILED: ${{ steps.audit.outputs.failed }}
        run: |
          echo "⚠️ Quarterly audit found ${AUDIT_FAIL} failing validator(s):${AUDIT_FAILED}"
          echo "Full results are in the docs-audit.md artifact. Audit is report-only; it surfaces drift without blocking."
